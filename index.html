<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="AutoCX Service Desk by Mihup: workshop job cards, OBD findings, quotes, analytics and post-service surveys.">
<title>AutoCX Service Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: workshop control room — left rail nav, job board of status lanes, job card as a two-column workbench. */
:root{
  --bg:#f2f3f1; --surface:#ffffff; --surface-2:#e9ebe8; --line:#d6dad5; --ink:#1a1e1c; --ink-2:#59615d;
  --accent:#0e6b67; --accent-ink:#ffffff; --accent-soft:#d9eeec;
  --warn:#a35f00; --warn-soft:#fbeed6; --crit:#b3261e; --crit-soft:#f9e0de; --good:#2b7a30; --good-soft:#e0f0e1;
  --plate:#ffffff; --plate-ink:#111111; --plate-blue:#1f4aa8; --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.06);
  --s1:#2a78d6; --s2:#eb6834; --seq-0:#f3f5f8; --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#6da7ec; --seq-4:#2a78d6; --seq-5:#184f95; --seq-ink-on:#ffffff; --grid:#e1e0d9;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111413; --surface:#191d1b; --surface-2:#212624; --line:#2e3431; --ink:#e5e9e7; --ink-2:#9ca5a1;
  --accent:#4fb3ad; --accent-ink:#06201e; --accent-soft:#16302e;
  --warn:#e3a54a; --warn-soft:#33281a; --crit:#f07d74; --crit-soft:#3a1f1d; --good:#7fc782; --good-soft:#1c2e1d;
  --plate:#f2f2ee; --plate-ink:#111111; --plate-blue:#2b5bc4; --shadow:0 1px 2px rgba(0,0,0,.3); --s1:#3987e5; --s2:#d95926; --seq-0:#222725; --seq-1:#104281; --seq-2:#1c5cab; --seq-3:#2a78d6; --seq-4:#5598e7; --seq-5:#9ec5f4; --seq-ink-on:#0b0b0b; --grid:#2c2c2a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111413; --surface:#191d1b; --surface-2:#212624; --line:#2e3431; --ink:#e5e9e7; --ink-2:#9ca5a1;
  --accent:#4fb3ad; --accent-ink:#06201e; --accent-soft:#16302e;
  --warn:#e3a54a; --warn-soft:#33281a; --crit:#f07d74; --crit-soft:#3a1f1d; --good:#7fc782; --good-soft:#1c2e1d;
  --plate:#f2f2ee; --plate-ink:#111111; --plate-blue:#2b5bc4; --shadow:0 1px 2px rgba(0,0,0,.3); --s1:#3987e5; --s2:#d95926; --seq-0:#222725; --seq-1:#104281; --seq-2:#1c5cab; --seq-3:#2a78d6; --seq-4:#5598e7; --seq-5:#9ec5f4; --seq-ink-on:#0b0b0b; --grid:#2c2c2a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding-block:18px;padding-inline:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.dealer{border-top:1px solid var(--line);padding-top:12px;font-weight:600;font-size:13.5px;line-height:1.3}
.dealer small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.brand .logo{height:26px;width:auto;display:block}
.brand i{display:inline-block;width:22px;height:22px;border-radius:6px;background:var(--accent);position:relative}
.brand i::after{content:"";position:absolute;inset:6px;border:2px solid var(--accent-ink);border-radius:50%}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:7px;color:var(--ink-2);font-weight:500;display:flex;justify-content:space-between;align-items:center}
nav button:hover{background:var(--surface-2);color:var(--ink)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
nav button:focus-visible,.btn:focus-visible,.chip-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.rail .foot{margin-top:auto;font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink-2);margin-right:6px}
.dot.on{background:var(--good)} .dot.warn{background:var(--warn)}
main{min-width:0;padding-block:20px 48px;padding-inline:24px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-family:var(--f-display);font-weight:600;font-size:28px;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0;letter-spacing:.01em}
h3{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600}
.sub{color:var(--ink-2);font-size:13px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:7px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.search{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;min-width:0;width:260px;max-width:100%}
input[type=text],input[type=number],input[type=tel],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus,.search:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);font-weight:500}
/* board */
.lanes-wrap{overflow-x:auto;padding-bottom:6px}
.lanes{display:grid;grid-template-columns:repeat(7,minmax(214px,1fr));gap:12px;min-width:1560px}
.lane{background:var(--surface-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.lane-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 4px}
.lane-h b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.02em}
.card{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow);position:relative}
.card:hover{border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.plate{font-family:var(--f-mono);font-size:12px;background:var(--plate);color:var(--plate-ink);border:1.5px solid var(--plate-ink);border-radius:4px;padding:1px 6px 1px 0;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;letter-spacing:.04em}
.plate::before{content:"IND";font-size:7px;font-family:var(--f-body);font-weight:700;background:var(--plate-blue);color:#fff;align-self:stretch;display:flex;align-items:center;padding:0 3px;border-radius:2px 0 0 2px;letter-spacing:.02em}
.jc{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.who{font-weight:600}
.meta{font-size:12px;color:var(--ink-2)}
.codes{display:flex;flex-wrap:wrap;gap:4px}
.code{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.code.crit{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.code.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;letter-spacing:.02em}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.good{background:var(--good-soft);color:var(--good)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.tag-sample{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);border:1px dashed var(--line);border-radius:4px;padding:0 4px}
.empty-lane{font-size:12px;color:var(--ink-2);padding:8px 4px}
/* ticket */
.stepper{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.step{flex:1 0 108px;font-size:11.5px;font-weight:600;color:var(--ink-2);padding:8px 8px 6px;border-top:3px solid var(--line);letter-spacing:.02em}
.step.done{border-color:var(--accent);color:var(--ink)}
.step.now{border-color:var(--accent);color:var(--accent)}
.grid2{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:13px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.addcode{display:flex;gap:6px;flex:1 1 220px;min-width:0}
.addcode input{flex:1}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td input,td select{padding:5px 7px;font-size:13px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.src{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.problem{font-weight:600}
.small{font-size:12px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:4px 9px;font-size:12px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"].ok{background:var(--good-soft);color:var(--good)}
.seg button[aria-pressed="true"].no{background:var(--crit-soft);color:var(--crit)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.totals{display:grid;grid-template-columns:auto auto;justify-content:end;gap:4px 24px;font-size:13px}
.totals .grand{font-weight:700;font-size:15px}
.dict{border:1px dashed var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.mic{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.mic.live{background:var(--crit);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--crit-soft)}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none}}
.note{font-size:12.5px;padding:8px 10px;border-radius:7px;background:var(--surface-2);color:var(--ink-2)}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.good{background:var(--good-soft);color:var(--good)} .note.crit{background:var(--crit-soft);color:var(--crit)}
.oem{border-left:3px solid var(--warn);padding:8px 10px;background:var(--warn-soft);border-radius:0 7px 7px 0;font-size:12.5px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.oem.solved{border-color:var(--good);background:var(--good-soft)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:12.5px}
.timeline li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px}
.timeline time{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.stars{display:flex;gap:4px}
.stars button{all:unset;cursor:pointer;font-size:20px;color:var(--line)}
.stars button[aria-pressed="true"]{color:var(--warn)}
/* settings */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.switch input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:17px}
.switch input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop{border:1.5px dashed var(--line);border-radius:9px;padding:16px;text-align:center;color:var(--ink-2);font-size:13px;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.log{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);max-height:140px;overflow:auto;background:var(--surface-2);border-radius:7px;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-2)}
.flow span{background:var(--surface-2);border-radius:6px;padding:3px 8px;color:var(--ink)}
.share{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.share .seg button{padding:6px 12px}
.share .seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
a.btn{text-decoration:none}
.qmeta{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.intabs{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}
.intabs .seg{background:var(--surface);align-self:flex-start}
.intabs .seg button{padding:6px 12px}
.intabs .seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.thumb{position:relative;margin:0;width:64px;height:64px;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:18px;height:18px;font-size:10px;line-height:18px;padding:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.thumb.sm{width:40px;height:40px}
.addphoto{border:1.5px dashed var(--line);border-radius:7px;width:64px;height:64px;background:transparent;color:var(--ink-2);cursor:pointer;font-size:11.5px;font-weight:600;line-height:1.2}
.addphoto.sm{width:40px;height:40px;font-size:16px}
.addphoto:hover{border-color:var(--accent);color:var(--accent)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.gallery figure{margin:0;display:flex;flex-direction:column;gap:3px;min-width:0}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:zoom-in;max-width:100%}
.gallery figcaption{font-size:10.5px;color:var(--ink-2);line-height:1.25;overflow-wrap:anywhere}
.lightbox{position:fixed;inset:0;background:rgba(10,12,11,.86);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:24px;z-index:20;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:82vh;border-radius:8px}
.lightbox p{color:#e5e9e7;margin:0;font-size:13px;text-align:center}
.pdfcard{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}
.pdfthumbs{display:flex;gap:8px}
.pdfthumbs img{width:92px;border:1px solid var(--line);border-radius:4px;background:#fff;box-shadow:var(--shadow);cursor:zoom-in}
.pdfstub{width:92px;height:130px;border:1px solid var(--line);border-radius:4px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);color:var(--crit);font-weight:700}
.pdfinfo{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 240px}
.editbar{display:flex;align-items:center;gap:8px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500;margin-bottom:14px}
.kv input{padding:5px 7px;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .tv{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.1}
.tile .tl{font-size:12.5px;font-weight:600}
.tile .ts{font-size:11.5px;color:var(--ink-2)}
.tile.warn{border-left:3px solid var(--warn)} .tile.crit{border-left:3px solid var(--crit)}
.insight ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.an-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px;margin-top:16px}
.an-grid .wide{grid-column:1/-1}
.hb{display:flex;flex-direction:column;gap:7px}
.hb-row{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:12.5px;padding:2px 0;cursor:default}
.hb-row:hover .hb-b{filter:brightness(1.12)}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.hb-t{height:12px;background:transparent;border-left:1px solid var(--grid);display:flex;align-items:center}
.hb-b{display:block;height:10px;background:var(--s1);border-radius:0 4px 4px 0}
.hb-b.alt{background:var(--s2)}
.hb-v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cols{display:flex;gap:10px;align-items:flex-end;height:190px;border-bottom:1px solid var(--grid);padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0;cursor:default}
.col .stack{flex:1;width:min(44px,100%);display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.seg2{display:block;width:100%;border-radius:4px 4px 0 0}
.seg2+.seg2{border-radius:0}
.cl{font-size:11px;color:var(--ink-2);transform:translateY(20px)}
.heat td.hc{font-variant-numeric:tabular-nums;font-weight:600;border:2px solid var(--surface);border-radius:4px}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;max-width:260px;box-shadow:var(--shadow)}
.progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .4s}
.npsbar{display:flex;gap:2px;height:16px;border-radius:4px;overflow:hidden;margin-bottom:8px}
.npsbar span{display:block;height:100%}

function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); cell=''; if(row.some(x=>x.trim()!=='')) rows.push(row); row=[]; }
    else cell+=c;
  }
  row.push(cell); if(row.some(x=>x.trim()!=='')) rows.push(row);
  if(!rows.length) return {headers:[],records:[]};
  const headers=rows[0].map(h=>h.trim().toLowerCase());
  return {headers, records: rows.slice(1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]??'').trim()])))};
}

function kbFind(code){ return S.kb.find(r => (r.dtc_code||'').toUpperCase() === String(code).toUpperCase()); }
function makeFinding(code, source, extra={}){
  const k = code ? kbFind(code) : null;
  const f = {
    id: uid(), code: code ? code.toUpperCase() : '', source,
    desc: k ? k.dtc_description : (code ? 'Code not in issue library' : ''),
    problem: k ? (k.probable_causes||'').split(';')[0].trim() : (extra.problem || 'Needs inspection'),
    action: k ? k.recommended_action : (code ? 'Diagnose with OEM tool; confirm fault before quoting' : 'Inspect and confirm'),
    actionType: k ? k.action_type : 'Inspection',
    part: k ? (k.parts_likely||'') : '',
    priority: k ? k.customer_priority : 'Recommended',
    oemSuggested: k ? k.oem_escalation_suggested === 'Yes' : !!code,
    oem: {status:'none', note:''},
    partPrice: '', labourHrs: 1, decision: 'approve', done:false
  };
  return Object.assign(f, extra);
}

function stageIndex(s){ return STATUSES.findIndex(x=>x.id===s); }
function quoteTotals(t, onlyApproved){
  const rate = Number(S.settings.pricing.labourRate)||0, tax = Number(S.settings.pricing.tax)||0;
  let parts=0, labour=0;
  t.findings.forEach(f => { if(onlyApproved && f.decision!=='approve') return; parts += Number(f.partPrice)||0; labour += (Number(f.labourHrs)||0)*rate; });
  const sub = parts+labour, gst = sub*tax/100;
  return {parts, labour, sub, gst, total: sub+gst};
}

  <div class="grid2">
    <div class="stack">
      ${vehiclePanel(t)}
      ${(t.photos||[]).length?`<section class="panel"><div class="panel-h"><h3>Photos</h3><span class="count">${t.photos.length}</span></div><div class="gallery">${t.photos.map(p=>{ const f=t.findings.find(x=>x.id===p.fid); return `<figure><img src="${p.data}" alt="${esc(p.src)}" data-action="zoom" data-pid="${p.id}"><figcaption>${esc(p.src)}${f?' · '+esc(f.code||f.problem.slice(0,24)):''}</figcaption></figure>`; }).join('')}</div></section>`:''}

          ${t.findings.map(f=>findingRow(t,f,editable)).join('')}</tbody></table></div>`:`<div class="note">No findings yet. Read the scanner, upload a scan file, add a code or dictate notes.</div>`}
      </section>

      <section class="panel">

          <div class="totals"><span>Parts</span><span class="num">${inr(qt.parts)}</span><span>Labour</span><span class="num">${inr(qt.labour)}</span><span>GST</span><span class="num">${inr(qt.gst)}</span><span class="grand">Total</span><span class="num grand">${inr(qt.total)}</span></div>
          ${showDecision?`<div class="small">${approved.length} of ${t.findings.length} items approved${inApproval?' — record the customer\'s choice per item, then confirm.':''}</div>`:''}`

function findingRow(t,f,editable){
  const srcLabel = {obd:'OBD scan', dictation:'Dictation', manual:'Added', oem:'OEM', drive:'Drive sync', scanner:'Scanner', note:'Text note', photo:'Photo'}[f.source]||f.source;
  const oemCell = f.oem.status==='none'

    : (f.oem.status==='sent'?'<span class="pill warn">Awaiting OEM</span>':'<span class="pill good">Solution in</span>');
  const oemBlock = f.oem.status==='sent' ? `<div class="oem"><b>Sent to Tata Motors</b><span class="small">Packet: VIN, ${esc(f.code||'advisor note')}, symptoms, scan snapshot.</span>
      <textarea data-oemnote="${f.id}" placeholder="Paste the OEM's reply or solution"></textarea><div><button class="btn small" data-action="oem-solve" data-fid="${f.id}">Add OEM solution to job card</button></div></div>`
    : f.oem.status==='solved' ? `<div class="oem solved"><b>OEM solution</b><span>${esc(f.oem.note)}</span></div>` : '';
  const problemCell = editable
    ? `<input type="text" data-fid="${f.id}" data-field="problem" value="${esc(f.problem)}" aria-label="Problem"><input type="text" data-fid="${f.id}" data-field="action" value="${esc(f.action)}" aria-label="Recommended action" style="margin-top:6px">`

  const typeCell = editable

  const priCell = editable
    ? `<select data-fid="${f.id}" data-field="priority" aria-label="Priority">${['Safety-critical','Recommended','Optional'].map(o=>`<option ${o===f.priority?'selected':''}>${o}</option>`).join('')}</select>`
    : `<span class="pill ${priClass(f.priority)}">${esc(f.priority)}</span>`;
  return `<tr><td>${f.code?`<span class="code ${priClass(f.priority)}">${esc(f.code)}</span>`:''}<div class="src" style="margin-top:4px">${esc(srcLabel)}</div>${f.desc?`<div class="small" style="max-width:180px">${esc(f.desc)}</div>`:''}</td>

    ${editable?`<td><button class="btn ghost small" data-action="remove" data-fid="${f.id}" aria-label="Remove finding">✕</button></td>`:''}</tr>`;

function quoteRow(t,f,editable,inApproval,showDecision){
  const rate = Number(S.settings.pricing.labourRate)||0;
  const line = (Number(f.partPrice)||0) + (Number(f.labourHrs)||0)*rate;
  const declined = showDecision && f.decision!=='approve';
  return `<tr style="${declined?'opacity:.55':''}"><td><div class="problem">${esc(f.action)}</div><div class="small">${esc(f.actionType)} · ${f.code?esc(f.code):'advisor note'}</div></td>
    <td>${editable?`<input type="text" data-fid="${f.id}" data-field="part" value="${esc(f.part)}" aria-label="Part">`:esc(f.part||'—')}</td>
    <td class="num">${editable?`<input type="number" min="0" step="50" data-fid="${f.id}" data-field="partPrice" value="${esc(f.partPrice)}" placeholder="0" style="width:96px;text-align:right" aria-label="Part price">`:inr(f.partPrice)}</td>
    <td class="num">${editable?`<input type="number" min="0" step="0.5" data-fid="${f.id}" data-field="labourHrs" value="${esc(f.labourHrs)}" style="width:70px;text-align:right" aria-label="Labour hours">`:esc(f.labourHrs)}</td>

    ${t.status==='in_repair'?`<td>${f.decision==='approve'?`<input type="checkbox" data-action="done" data-fid="${f.id}" ${f.done?'checked':''} aria-label="Mark item done">`:''}</td>`:''}</tr>`;

function nextAction(t){
  const ap = t.findings.filter(f=>f.decision==='approve');
  switch(t.status){
    case 'checked_in': return {label:'Start diagnosis'};
    case 'diagnosing': return t.findings.length ? {label:'Send quote to customer'} : {label:'Send quote to customer', disabled:true, hint:'Add at least one finding to build the quote.'};
    case 'awaiting_approval': return {label:'Confirm customer decision', hint:'Customer opens the WhatsApp quote link and approves items one by one. Record their choice below, then confirm.'};
    case 'approval_received': return {label:'Acknowledge as service head', hint: ap.length ? `${ap.length} of ${t.findings.length} items approved. Acknowledge to start repair.` : 'Customer declined all items. Acknowledge to release the vehicle.'};
    case 'in_repair': { const left = ap.filter(f=>!f.done).length; return left ? {label:'Mark vehicle ready', disabled:true, hint:`${left} approved item${left>1?'s':''} still open. Tick each item when done.`} : {label:'Mark vehicle ready'}; }
    case 'ready': return {label:'Deliver vehicle'};
    default: return null;
  }
}
function log(t, text){ t.timeline.push({t:nowIso(), text}); }
function advance(t){
  const ap = t.findings.filter(f=>f.decision==='approve');
  if(t.status==='checked_in'){ t.status='diagnosing'; log(t,'Diagnosis started'); }
  else if(t.status==='diagnosing'){ t.findings.forEach(f=>f.decision='approve'); t.status='awaiting_approval'; log(t,`Itemised quote from ${S.settings.dealer.name} sent to customer on WhatsApp (${inr(quoteTotals(t).total)}) — simulated`); }
  else if(t.status==='awaiting_approval'){ const n=ap.length, all=t.findings.length; const kind = n===all?'full approval':(n===0?'rejection':'partial approval'); t.status='approval_received'; log(t,`Customer decision recorded: ${kind} (${n} of ${all} items)`); }
  else if(t.status==='approval_received'){ if(ap.length){ t.status='in_repair'; log(t,'Service head acknowledged. Repair started; customer told the expected time.'); } else { t.status='ready'; log(t,'Service head acknowledged. No work approved; vehicle released.'); } }
  else if(t.status==='in_repair'){ t.status='ready'; log(t,'Vehicle marked ready. Customer notified on WhatsApp — simulated'); }
  else if(t.status==='ready'){ t.status='delivered'; log(t,'Vehicle delivered. Feedback request sent — simulated'); }
  save(); render(); toast(STATUSES.find(s=>s.id===t.status).label);
}

/* ---------- imports ---------- */
function codesFromText(text){ return [...new Set((text.match(DTC_RE)||[]).map(c=>c.toUpperCase()))]; }
function addCodes(t, codes, source){
  const have = new Set(t.findings.map(f=>f.code));
  const fresh = codes.filter(c=>!have.has(c));
  fresh.forEach(c => t.findings.push(makeFinding(c, source)));
  return fresh;
}
function nextJobId(){ const n = S.tickets.reduce((m,t)=>Math.max(m, parseInt(String(t.id).replace(/\D/g,''))||0), 24100); return 'JC-'+(n+1); }
function importScanText(text, filename, source){
  // Route rows by VIN if a VIN column exists; otherwise return codes for the open job card.
  const up = S.settings.upload;
  let groups = {};
  if(/,/.test(text.split(/\r?\n/)[0]||'')){
    const {headers, records} = parseCSV(text);
    const vinCol = headers.find(h=>h===up.vinColumn.toLowerCase()) || headers.find(h=>h.includes('vin'));
    const dtcCol = headers.find(h=>h===up.dtcColumn.toLowerCase()) || headers.find(h=>/dtc|code/.test(h));
    if(vinCol && dtcCol){
      records.forEach(r => { const v=(r[vinCol]||'').toUpperCase(); const cs=codesFromText(r[dtcCol]||''); if(v&&cs.length){ (groups[v] ||= {codes:new Set(), reg:r.reg||r.registration||'', km:r.odometer||r.km||''}); cs.forEach(c=>groups[v].codes.add(c)); } });
    }
  }
  if(!Object.keys(groups).length){
    const vin = (text.match(VIN_RE)||[])[0];
    const codes = codesFromText(text);
    if(!codes.length) return {created:0, updated:0, codes:[], vin:null};
    if(!vin) return {created:0, updated:0, codes, vin:null};
    groups[vin.toUpperCase()] = {codes:new Set(codes), reg:'', km:''};
  }
  let created=0, updated=0;
  Object.entries(groups).forEach(([vin,g]) => {
    let t = S.tickets.find(x=>x.vin===vin && x.status!=='delivered');
    if(!t){
      t = {id:nextJobId(), reg:g.reg||'Reg pending', vin, model:'Tata Safari', variant:'', km:Number(g.km)||0, customer:'Walk-in (from scan)', phone:'', status:'diagnosing',
        created:nowIso(), transcript:'', findings:[], timeline:[], feedback:null, origin: source==='drive'?`Drive: ${filename}`:`Upload: ${filename}`};
      S.tickets.unshift(t); created++; log(t, `Job card opened from scan file ${filename}`);
    } else updated++;
    const fresh = addCodes(t, [...g.codes], source==='drive'?'drive':'obd');
    if(fresh.length) log(t, `${fresh.length} code${fresh.length>1?'s':''} added from ${filename}: ${fresh.join(', ')}`);
  });
  save(); return {created, updated, codes:[], vin:null};
}
function importKB(text, label){
  const {headers, records} = parseCSV(text);
  if(!headers.includes('dtc_code') || !headers.includes('recommended_action')) return false;
  S.kb = records.filter(r=>r.dtc_code); S.settings.kbSource = label; save(); return true;
}

/* ---------- Google Drive sync (viewer's Drive connector) ---------- */
let driveState = {ok:false, msg:'', kind:''};
let mcpRef = null, syncing = false, syncTimer = null;
const DRIVE = 'Google Drive';
function findFiles(node, out=[]){
  if(Array.isArray(node)) node.forEach(n=>findFiles(n,out));
  else if(node && typeof node==='object'){
    const id = node.id || node.fileId; const name = node.title || node.name;
    if(typeof id==='string' && typeof name==='string') out.push({id, name, modified: node.modifiedTime || node.modified_time || '', mime: node.mimeType || ''});
    Object.values(node).forEach(v=>{ if(v && typeof v==='object') findFiles(v,out); });
  }
  return out;
}
function b64ToText(b64){ const bin = atob(b64.replace(/\s/g,'')); const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0)); return new TextDecoder().decode(bytes); }
function extractFileText(res){
  const p = res && res.payload;
  const tryB64 = s => { try{ const txt=b64ToText(s); return /[\x00-\x08]/.test(txt)?null:txt; }catch(e){ return null; } };
  const scan = (n) => {
    if(!n) return null;
    if(typeof n==='string'){ return /^[A-Za-z0-9+/=\s]{16,}$/.test(n) ? (tryB64(n) ?? n) : n; }
    if(typeof n==='object'){ for(const k of ['content','data','base64Content','fileContent','contentBase64','body']){ if(typeof n[k]==='string'){ const r=scan(n[k]); if(r) return r; } }
      for(const v of Object.values(n)){ if(v && typeof v==='object'){ const r=scan(v); if(r) return r; } } }
    return null;
  };
  return scan(p) || (res && res.content && res.content.find(b=>b.type==='text')?.text) || '';
}
function driveError(e){
  const c = e && e.code;
  const m = {
    needs_reauth:'Reconnect Google Drive in claude.ai Settings → Connectors, then sync again.',
    server_not_connected:'Add the Google Drive connector in claude.ai Settings → Connectors to turn on auto-sync.',
    selection_required:'Choose which Google Drive account to use in the prompt, then sync again.',
    not_in_manifest:'Google Drive access is turned off for this page. Allow it from the page\'s permissions to sync.',
    blocked_by_policy:'Your organization blocks this Drive action.',
    server_unavailable:'Google Drive did not respond. Try again in a minute.',
    not_granted:'Connector access is not available in this view.',
    capability_disabled:'Connector access is not available in this view.',
    tool_error:'Drive reported a problem: ' + (e && e.message || '')
  }[c];
  return m || ('Sync failed: ' + (e && (e.message||c) || 'unknown error'));
}
async function syncDrive(manual){
  if(syncing) return; syncing = true;
  const d = S.settings.drive; const btn = $('#sync-btn'); if(btn){ btn.disabled=true; btn.textContent='Syncing…'; }
  try{
    const mcp = mcpRef || await claude.use('mcp'); mcpRef = mcp;
    if(!mcp){ driveState = {ok:false, kind:'warn', msg:'Connectors aren\'t available in this view, so Drive sync is off here. Upload scan files instead.'}; return; }
    q = `title contains '${d.keyword.replace(/'/g,"\\'")}'`;
    if(d.folderId.trim()) q += ` and parentId = '${d.folderId.trim().replace(/'/g,"\\'")}'`;
    const res = await mcp.callTool(DRIVE,'search_files',{query:q, pageSize:25, excludeContentSnippets:true},{cache:false});
    const files = findFiles(res.payload).filter((f,i,a)=>a.findIndex(x=>x.id===f.id)===i);
    let newFiles=0, jobs=0, upd=0;
    for(const f of files){
      const stamp = f.id + '|' + f.modified;
      if(d.synced[f.id] === stamp) continue;
      const dl = await mcp.callTool(DRIVE,'download_file_content',{fileId:f.id, exportMimeType:'text/csv'},{cache:false});
      const text = extractFileText(dl);
      if(!text){ d.log.push(`${new Date().toLocaleTimeString('en-IN')} skipped ${f.name} (no readable text)`); continue; }
      if(importKB(text, `Drive: ${f.name}`)) d.log.push(`${new Date().toLocaleTimeString('en-IN')} issue library updated from ${f.name}`);
      else { const r = importScanText(text, f.name, 'drive'); jobs+=r.created; upd+=r.updated; d.log.push(`${new Date().toLocaleTimeString('en-IN')} ${f.name}: ${r.created} new, ${r.updated} updated job cards`); }
      d.synced[f.id] = stamp; newFiles++;
    }
    d.lastSync = nowIso();
    driveState = {ok:true, kind:'good', msg: files.length ? `${files.length} matching file${files.length>1?'s':''} found · ${newFiles} new or changed · ${jobs} job cards opened, ${upd} updated` : `Connected. No files with "${d.keyword}" in the name yet.`};
    if(manual) toast('Drive sync complete');
  }catch(e){
    driveState = {ok:false, kind:'crit', msg: driveError(e)};
  }finally{
    syncing=false; save(); if(S.view==='settings'||S.view==='board') render(); else render();
  }
}
function scheduleSync(){
  clearInterval(syncTimer);
  const d=S.settings.drive; if(!d.enabled) return;
  syncTimer = setInterval(()=>{ if(!document.hidden) syncDrive(false); }, Number(d.interval)*60e3);
}
async function maybeAutoSyncOnLoad(){
  const d=S.settings.drive; if(!d.enabled) return;
  try{
    const perms = await claude.use('permissions');
    const st = perms ? await perms.state('mcp:'+DRIVE).catch(()=> 'unavailable') : 'unavailable';
    if(st==='granted') syncDrive(false);
  }catch(e){}
  scheduleSync();
}

/* ---------- dictation ---------- */
let rec = null;
function startMic(){
  const t = S.tickets.find(x=>x.id===S.current); if(!t) return;
  const status = $('#dict-status'); const btn = $('#mic');
  if(S.settings.dictation.engine==='mihup'){ status.textContent='Mihup STT needs an API key and a server-side relay; use browser speech or type notes for now.'; return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ status.textContent='Speech input isn\'t supported in this browser. Type the notes or upload a transcript.'; return; }
  if(rec){ rec.stop(); return; }
  rec = new SR(); rec.lang = S.settings.dictation.lang==='hinglish' ? 'hi-IN' : S.settings.dictation.lang; rec.interimResults = true; rec.continuous = true;
  const ta = $('#transcript'); const base = ta.value ? ta.value.trim()+' ' : '';
  rec.onresult = ev => { let s=''; for(const r of ev.results) s += r[0].transcript; ta.value = base + s; t.transcript = ta.value; };
  rec.onerror = ev => { status.textContent = ev.error==='not-allowed'||ev.error==='service-not-allowed' ? 'The microphone is blocked in this view. Type the notes, or upload a transcript from your phone recorder.' : 'Dictation stopped: '+ev.error; };
  rec.onend = () => { rec=null; btn && btn.classList.remove('live'); save(); };
  try{ rec.start(); btn.classList.add('live'); status.textContent='Listening… tap the mic again to stop.'; }catch(e){ rec=null; status.textContent='Couldn\'t start the microphone here. Type the notes instead.'; }
}
function localExtract(text){
  const sentences = text.split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(s=>s.length>6);
  const words = s => new Set(s.toLowerCase().match(/[a-z]{3,}/g)||[]);
  const stop = new Set(['the','and','with','from','also','says','customer','feels','keeps','some','when','that','this','there','have','has','car','vehicle','check']);
  return sentences.map(s => {
    const w = [...words(s)].filter(x=>!stop.has(x));
    let best=null, score=0;
    S.kb.forEach(k => { const kw = words([k.dtc_description,k.typical_symptoms,k.system,k.parts_likely].join(' ')); const sc = w.filter(x=>kw.has(x)).length; if(sc>score){score=sc; best=k;} });
    if(best && score>=2) return {problem:s.replace(/\.$/,''), code:best.dtc_code, action:best.recommended_action, actionType:best.action_type, priority:best.customer_priority, part:best.parts_likely};
    const body = /door|panel|dent|scratch|bumper|paint|rattle|trim/i.test(s);
    return {problem:s.replace(/\.$/,''), code:null, action: body?'Inspect and repair body or trim issue':'Inspect and confirm', actionType: body?'Body work':'Inspection', priority:'Optional', part:''};
  });
}
async function extractFindings(){
  const t = S.tickets.find(x=>x.id===S.current); if(!t) return;
  const text = ($('#transcript').value||'').trim(); t.transcript = text;
  const status = $('#dict-status');
  if(!text){ status.textContent='Add some notes first.'; return; }
  let items = null;
  if(S.settings.dictation.aiExtract){
    try{
      const sample = await claude.use('sample');
      if(sample){
        status.textContent='Reading the notes…'; aiNotice('notes');
        const lib = S.kb.map(k=>`${k.dtc_code} | ${k.dtc_description} | symptoms: ${k.typical_symptoms} | action: ${k.recommended_action} | type: ${k.action_type} | priority: ${k.customer_priority}`).join('\n');
        const prompt = `You help a car service advisor at a Tata workshop. Turn the advisor's notes into separate service findings.\n\nIssue library (OBD code | description | symptoms | action | type | priority):\n${lib}\n\nAdvisor notes:\n"""${text.slice(0,4000)}"""\n\nReply with only a JSON array. Each item: {"problem": short problem statement in English, "code": matching library code or null, "action": recommended action (use the library action when matched), "actionType": one of "Replace part","Repair","Body work","Inspection","Service","Software update", "priority": one of "Safety-critical","Recommended","Optional", "part": likely part or ""}. Only include problems the notes actually mention. Notes may be in Hindi or Hinglish; answer in English.`;
        const imgs = S.aiImages && S.pending.dict.length ? S.pending.dict.map(p=>dataUrlToBlob(p.data)) : null;
        const out = await sample.json(imgs ? prompt + `\n\n${imgs.length} photo${imgs.length>1?'s are':' is'} attached, numbered 1 to ${imgs.length} in order. Use them to describe problems (dents, leaks, warning lights, worn parts) and add "photos": [numbers of the photos that show this problem] to each item.` : prompt, imgs ? {modelTier:'default', images: imgs} : {modelTier:'quick'});
        if(Array.isArray(out)) items = out.filter(o=>o && o.problem);
      }
    }catch(e){
      status.textContent = e && e.code==='not_granted' ? 'AI matching was not allowed; used keyword matching instead.' : 'AI matching unavailable right now; used keyword matching instead.';
    }
  }
  if(!items) items = localExtract(text);
  let added=0; const newIds=[];
  items.forEach(it => {
    const code = it.code && kbFind(it.code) ? String(it.code).toUpperCase() : '';
    if(code && t.findings.some(f=>f.code===code)) { const f=t.findings.find(f=>f.code===code); if(!f.problem.includes(it.problem)) f.problem = it.problem; return; }
    const nf = makeFinding(code, 'dictation', {problem:it.problem, action:it.action||'Inspect and confirm', actionType:it.actionType||'Inspection', priority:it.priority||'Recommended', part:it.part||'', desc: code ? kbFind(code).dtc_description : 'From advisor notes'});
    t.findings.push(nf); newIds.push(nf.id);
    (Array.isArray(it.photos)?it.photos:[]).forEach(n => { const p = S.pending.dict[Number(n)-1]; if(p && !p.fid) p.fid = nf.id; });
    added++;
  });
  if(S.pending.dict.length){ S.pending.dict.forEach(p => { if(!p.fid) p.fid = newIds[0] || null; }); commitPending(t,'dict',undefined,'Dictation'); }
  log(t, `${added} finding${added===1?'':'s'} added from advisor dictation`);
  save(); render(); toast(`${added} finding${added===1?'':'s'} added from notes`);
}

/* ---------- scanner ---------- */
function readScanner(){
  const t = S.tickets.find(x=>x.id===S.current); if(!t) return;
  const sc = S.settings.scanner;
  if(!sc.demo){ toast('Live scans arrive through the Drive folder. Run a scan on the bridge, then sync.'); return; }
  // Demo: a repeatable sample read based on the job card
  let h=0; for(const ch of (t.vin||t.reg)) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  const pick = [S.kb[h % S.kb.length], S.kb[(h>>5) % S.kb.length]].filter(Boolean).map(k=>k.dtc_code);
  if(!t.vin){ t.vin = ('MAT632145' + (h.toString(36).toUpperCase() + 'XWK00000')).replace(/[IOQ]/g,'X').slice(0,17); log(t, `VIN read from scanner: ${t.vin} (demo)`); }
  const fresh = addCodes(t, pick, 'scanner');
  log(t, fresh.length ? `Scanner read (demo): ${fresh.join(', ')}` : 'Scanner read (demo): no new codes');
  save(); render(); toast(fresh.length?`${fresh.length} code${fresh.length>1?'s':''} read from scanner (demo)`:'No new codes');
}

function handleObdFile(text, name){
  const t = S.tickets.find(x=>x.id===S.current);

    if(vin && !t.vin){ t.vin = vin.toUpperCase(); log(t, `VIN read from ${name}: ${t.vin}`); }
    const codes = codesFromText(text);
    if(!codes.length){ toast('No OBD codes found in that file'); return; }
    const fresh = addCodes(t, codes, 'obd'); log(t, `${fresh.length} code${fresh.length===1?'':'s'} added from ${name}`); save(); render(); toast(`${fresh.length} code${fresh.length===1?'':'s'} added`);
  } else {
    const r = importScanText(text, name, 'upload');
    if(r.codes && r.codes.length && !r.created && !r.updated){ toast('Codes found but no VIN — open a job card and upload there'); return; }
    render(); toast(`${r.created} job card${r.created===1?'':'s'} opened, ${r.updated} updated`);
  }
}

function bindDrops(){

function aiSubmit(){
  const ai = S.settings.ai, d = S.aiDraft;
  const provider = $('#ai-provider').value, name = $('#ai-name').value.trim(), model = $('#ai-model').value.trim();
  const key = $('#ai-key').value.trim(), endpoint = ($('#ai-endpoint') && $('#ai-endpoint').value.trim()) || '';
  if(!name){ toast('Give the model a display name'); return; }
  if(!model){ toast('Enter the model ID'); return; }
  if(needsEndpoint(provider) && !/^https?:\/\//.test(endpoint)){ toast('Enter the endpoint URL, starting with https://'); return; }
  if(d.id){
    const p = ai.profiles.find(x=>x.id===d.id);
    Object.assign(p, {provider, name, model, endpoint: needsEndpoint(provider)?endpoint:''}); if(key) p.key = key;
  } else {
    if(!key && provider!=='mihup'){ toast('Paste the API key'); return; }
    ai.profiles.push({id: uid(), provider, name, model, key, endpoint: needsEndpoint(provider)?endpoint:''});
  }
  S.aiDraft = {id:'', provider:'mihup', name:'', model:'', key:'', endpoint:''};
  save(); render(); toast(d.id ? 'Model updated' : 'Model added');
}

const SYSTEM_GROUP = s => {
  s = String(s||'');

  if(/Turbo|air intake/i.test(s)) return 'Turbo and air intake';
  if(/Fuel/i.test(s)) return 'Fuel and injection';
  if(/Cooling/i.test(s)) return 'Cooling';
  if(/Electrical|Network|Sensors/i.test(s)) return 'Electrical and sensors';
  if(/Brakes|ABS/i.test(s)) return 'Brakes and ABS';
  if(/Transmission/i.test(s)) return 'Transmission';
  if(/Airbag/i.test(s)) return 'Airbags';
  if(/Engine start/i.test(s)) return 'Starting';
  if(/Body/i.test(s)) return 'Body and paint';

const DECLINE_REASONS = ['Too expensive','Will do at next service','Getting it done elsewhere','Not convinced it is needed','Waiting for warranty or insurance','Part not in stock'];

  const body = [['Dent on rear door','Body work'],['Scratched front bumper','Body work'],['Rattle from door trim','Body work'],['Cracked fog lamp','Replace part'],['Worn wiper blades','Replace part'],['AC cooling weak','Repair']];

    return Math.round(({ 'Replace part':between(2500,12000), 'Repair':between(1500,7000), 'Body work':between(2500,14000), 'Inspection':between(500,1500), 'Service':between(800,3000), 'Software update':between(600,1800) }[type] || 2000)/100)*100;
  };
  const jobs = []; const now = Date.now(); const vins = [];
  for(let i=0;i<240;i++){
    const daysAgo = Math.floor(Math.pow(r(),0.9)*182), date = new Date(now - daysAgo*864e5 - between(0,10)*3600e3);
    const model = r()<0.68 ? 'Tata Safari' : (r()<0.65 ? 'Tata Harrier' : 'Tata Nexon');
    const km = Math.round(between(4000, 120000)/100)*100;
    let vin = 'MAT' + (100000 + Math.floor(r()*900000)) + 'S' + i; if(vins.length > 20 && r() < 0.08) vin = pick(vins); vins.push(vin);
    const n = 1 + Math.floor(Math.pow(r(),1.6)*4) + (km > 60000 ? 1 : 0);
    const items = [];
    for(let j=0;j<n;j++){
      if(r() < 0.22){ const [problem, type] = pick(body); items.push({code:'', system:'Body and paint', problem, actionType:type, priority: r()<0.2?'Recommended':'Optional', value: priceFor(type,''), oemSuggested:false}); continue; }

    const oemItems = items.filter(x=>x.oemSuggested && r()<0.4);

      decision: between(0.5, 6) + (quoteValue > 25000 ? between(3, 20) : 0),
      ack: between(0.2, 2.5),

  }

}
function anFilter(){
  const days = {'30':30,'90':90,'180':182}[S.anPeriod||'180'];

const pct = (a,b) => b ? Math.round(a*100/b) : 0;
const hrs = h => h >= 48 ? (h/24).toFixed(1)+' days' : Math.round(h)+' h';

function simulateResponse(aud, survey, channel, seedStr){
  const purpose = survey.purpose || 'psf'; let booked = null;
  let s = 0; for(const c of seedStr + aud.id) s = (s*31 + c.charCodeAt(0)) >>> 0;
  const r = rng(s); r(); r(); r(); const j = aud.job || {rating: (aud.live && aud.live.feedback && aud.live.feedback.rating) || 4, delayed:false, comeback:false, declinedAll:false, quoteValue:0, approvedValue:0, items:[]};
  const reachP = {voice:0.64, whatsapp:0.5, sms:0.28, auto:0.74}[channel] || 0.6;
  const usedCh = channel==='auto' ? (r()<0.7 ? 'voice' : 'whatsapp') : channel;
  if(r() > reachP){ const st = r()<0.12 ? 'Wrong number' : r()<0.3 ? 'Asked to call later' : (usedCh==='voice'?'No answer':'No reply'); return {status:st, channel:usedCh, answers:{}, transcript:[]}; }
  if(r() < 0.1) return {status:'Declined survey', channel:usedCh, answers:{}, transcript:[{who:'agent', text:fill(survey.greeting, aud)},{who:'cust', text:'Not now, I am busy.'}]};
  const answers = {}, transcript = [{who:'agent', text:fill(survey.greeting, aud)},{who:'cust', text: pickOf(r,['Haan, boliye.','Yes, go ahead.','Ok, quickly please.'])}];
  const base = Math.max(1, Math.min(5, j.rating + (r()<0.2?-1:0) + (r()<0.15?1:0)));
  let theme = 'good';
  survey.questions.forEach(q => {
    let a, said;
    if(q.type==='rating'){ a = Math.max(1, Math.min(5, base + (r()<0.25 ? (r()<0.5?-1:1) : 0))); said = pickOf(r, [`${a}`, `I'd say ${a}`, `${a} out of 5`]); }
    else if(q.type==='nps'){ a = pickOf(r, {5:[9,10,10],4:[8,9,9,10],3:[6,7,8],2:[3,4,5,6],1:[0,1,2,3]}[base]); said = pickOf(r, [`${a}`, `Maybe ${a}`, `${a} I think`]); }
    else if(q.type==='yesno'){
      const t = q.text.toLowerCase(); let p = 0.86;
      if(purpose!=='psf' && /book|slot|fit|schedule|complete/.test(t) && booked===null){ p = {declined:0.3, partial:0.45, parts:0.72}[purpose] || 0.5; if((aud.reasons||[]).includes('Getting it done elsewhere')) p = 0.1; if((aud.reasons||[]).includes('Will do at next service')) p += 0.1; a = r() < p ? 'Yes' : 'No'; booked = a==='Yes'; said = booked ? pickOf(r,['Yes, please book it','Haan, kar dijiye','Ok, book it']) : pickOf(r,['Not right now','Nahi, abhi nahi','No, thanks']); answers[q.id]=a; transcript.push({who:'agent', text:q.text},{who:'cust', text:said}); return; }
      if(/time|promised|ready/.test(t)) p = j.delayed ? 0.2 : 0.92;
      else if(/fix|first time|resolved/.test(t)) p = j.comeback ? 0.15 : 0.93;
      else if(/charge|explain|cost/.test(t)) p = (j.quoteValue && j.approvedValue/j.quoteValue < 0.5) ? 0.55 : 0.88;
      a = r() < p ? 'Yes' : 'No'; said = a==='Yes' ? pickOf(r,['Yes','Haan','Yes, it was']) : pickOf(r,['No','Nahi','Not really']);
      if(a==='No' && /time|promised/.test(t)) theme = 'delay'; if(a==='No' && /fix/.test(t)) theme = 'comeback'; if(a==='No' && /charge/.test(t)) theme = 'price';
    }
    else if(q.type==='choice' && /stopped|reason|why/i.test(q.text) && (aud.reasons||[]).length && q.options){ const map = {'Too expensive':'Price','Will do at next service':'Did not feel urgent','Not convinced it is needed':'Did not feel urgent','Getting it done elsewhere':'Got it done elsewhere','Waiting for warranty or insurance':'Needed time to decide','Part not in stock':'Other'}; a = map[aud.reasons[0]]; if(!q.options.includes(a)) a = q.options[0]; said = a; }
    else if(q.type==='choice' && booked===false && q.options && /when|day|suit/i.test(q.text)){ a = q.options[q.options.length-1]; said = a; }
    else if(q.type==='choice'){ const opts = q.options && q.options.length ? q.options : ['Other']; const w = opts.map((_,i)=>1/(i+1.2)); let x = r()*w.reduce((a,b)=>a+b,0), k = 0; while(k < opts.length-1 && (x -= w[k]) > 0) k++; a = opts[k]; said = a; }
    else { if(base<=3 && theme==='good') theme = r()<0.5 ? 'price' : 'delay'; if(theme==='good' && r()<0.4) theme = 'ask'; a = pickOf(r, THEMES[theme]); said = a; }
    answers[q.id] = a;
    transcript.push({who:'agent', text:q.text}, {who:'cust', text:said});
  });
  transcript.push({who:'agent', text:'Thank you for your time. Have a good day!'});
  return {status:'Completed', channel:usedCh, answers, transcript, theme, booked};
}
function pickOf(r, arr){ return arr[Math.floor(r()*arr.length)]; }
function fill(s, aud){ return String(s||'').replace(/\{pending\}/g, (aud.pending&&aud.pending.length) ? aud.pending.slice(0,2).join(' and ') : 'some recommended work').replace(/\{customer\}/g, (aud.customer||'').split(' ')[0]||'there').replace(/\{dealer\}/g, S.settings.dealer.name).replace(/\{model\}/g, aud.model||'car'); }

function needsCallback(survey, res){
  if(res.status!=='Completed') return false;
  if((survey.purpose||'psf')!=='psf') return !!res.booked;
  return survey.questions.some(q => (q.type==='rating' && Number(res.answers[q.id])<=2) || (q.type==='nps' && Number(res.answers[q.id])<=6) || (q.type==='yesno' && /fix/i.test(q.text) && res.answers[q.id]==='No'));
}

function campaignStats(c){

  const npsQ = sv.questions.find(q=>q.type==='nps'), ratQ = sv.questions.find(q=>q.type==='rating');

  const reached = res.filter(x=>!['No answer','No reply','Wrong number'].includes(x.status)).length;

function focusTest(){ const i = $('#sv-test-in'); if(i) i.focus(); const c = $('#sv-chat'); if(c) c.scrollTop = c.scrollHeight; }
function parseAnswer(q, text){
  const t = text.toLowerCase().trim();
  const words = {zero:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10, ek:1, do:2, teen:3, char:4, chaar:4, paanch:5, panch:5, das:10};
  const num = (t.match(/\b(10|[0-9])\b/)||[])[1] ?? Object.entries(words).find(([w])=>new RegExp('\\b'+w+'\\b').test(t))?.[1];
  if(q.type==='rating'){ if(num!=null && num>=1 && num<=5) return Number(num); if(/excellent|bahut accha|very good|great/.test(t)) return 5; if(/good|accha|achha/.test(t)) return 4; if(/ok|okay|theek|average/.test(t)) return 3; if(/very bad|bahut bura|terrible/.test(t)) return 1; if(/bad|bura|poor/.test(t)) return 2; return null; }
  if(q.type==='nps'){ return num!=null && num>=0 && num<=10 ? Number(num) : null; }
  if(q.type==='yesno'){ if(/\b(yes|haan|han|ha|ji|yeah|yep|sure|of course|bilkul)\b/.test(t)) return 'Yes'; if(/\b(no|nahi|nahin|nope|not)\b/.test(t)) return 'No'; return null; }
  if(q.type==='choice'){ const o = (q.options||[]).find(o => t.includes(o.toLowerCase()) || o.toLowerCase().split(' ').some(w=>w.length>3 && t.includes(w))); return o || null; }
  return text.trim() || null;
}
async function testReply(text){
  const st = S.svTestState; if(!st || st.done) return;
  const sv = surveyById(st.sv); S.svTest.push({who:'cust', text});
  if(st.i === -1){
    if(/\b(no|nahi|busy|later)\b/i.test(text)){ agentSay('No problem. We will call you at a better time. Thank you!'); st.done = true; render(); return; }
    st.i = 0; agentSay(sv.questions[0].text); render(); focusTest(); return;
  }
  const q = sv.questions[st.i]; let a = parseAnswer(q, text);
  if(a==null && q.type!=='text'){
    try{ const sample = await claude.use('sample'); if(sample){ const out = await sample.json(`A customer answered a survey question on a phone call. Question: "${q.text}" (answer type: ${q.type}${q.options?', options: '+q.options.join(' | '):''}). Customer said: "${text}". Reply with only JSON {"answer": the answer as ${q.type==='rating'?'a number 1-5':q.type==='nps'?'a number 0-10':q.type==='yesno'?'"Yes" or "No"':'one of the options exactly'}, or null if unclear}.`, {modelTier:'quick'}); if(out && out.answer!=null && out.answer!=='') a = q.type==='rating'||q.type==='nps' ? Number(out.answer) : out.answer; } }catch(e){}
  }
  if(a==null || (typeof a==='number' && isNaN(a))){ agentSay(q.type==='rating'?'Sorry, could you give a number from 1 to 5?':q.type==='nps'?'Sorry, could you say a number from 0 to 10?':q.type==='yesno'?'Sorry, was that a yes or a no?':`Sorry, which one: ${(q.options||[]).join(', ')}?`); render(); focusTest(); return; }
  st.answers[q.id] = a; st.i++;
  if(st.i >= sv.questions.length){ agentSay('Thank you for your time. Have a good day!'); st.done = true; }
  else agentSay(sv.questions[st.i].text);
  render(); focusTest();
}

function runCampaign(id){
  const c = S.campaigns.find(x=>x.id===id); if(!c || c.status==='done') return;
  const step = Math.max(1, Math.ceil(c.jobIds.length/24));
  const tick = setInterval(() => {
    const c2 = S.campaigns.find(x=>x.id===id); if(!c2){ clearInterval(tick); return; }
    c2.progress = Math.min(c2.jobIds.length, c2.progress + step);
    if(c2.progress >= c2.jobIds.length){ c2.status = 'done'; clearInterval(tick); save(); toast(`${c2.name} finished`); }
    if(S.view==='surveys' && (S.svCampaign===id || (!S.svCampaign && S.svTab==='campaigns'))) render();
  }, 450);

        <b>${esc(pdf.no)}</b>
        <span class="small">${pdf.pages?pdf.pages+' page'+(pdf.pages>1?'s':'')+' · ':''}${kb(pdf.size)} · created ${new Date(pdf.at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</span>
        <span class="small">Total ${inr(quoteTotals(t, stageIndex(t.status)>=3).total)}${t.photos&&t.photos.length?` · ${t.photos.length} photo${t.photos.length>1?'s':''} included`:''}</span>
        ${changed?'<span class="pill warn" style="align-self:flex-start">Job card changed — create a new version</span>':''}
        ${q.driveLink && q.driveNo===pdf.no ? '<span class="pill good" style="align-self:flex-start">Saved to Drive</span>' : ''}
        <div class="toolbar" style="margin-top:4px">
          ${pdf.thumbs.length?'<button class="btn small" data-action="pdf-preview">Preview</button>':''}
          <button class="btn small" data-action="pdf-download" ${busy?'disabled':''}>${busy==='pdf'?'Saving…':'Download'}</button>
          <button class="btn small" data-action="pdf-drive" ${busy?'disabled':''}>${busy==='drive'?'Saving to Drive…':(q.driveLink && q.driveNo===pdf.no ? 'Save again to Drive' : 'Save to Drive and get link')}</button>
          ${q.driveLink?`<a class="btn small ghost" href="${esc(q.driveLink)}" target="_blank" rel="noopener">Open in Drive ↗</a>`:''}
          <button class="btn small ghost" data-action="pdf-gen" ${busy?'disabled':''}>New version</button>
        </div>
      </div></div>`
    : `<div class="toolbar"><button class="btn primary" data-action="pdf-gen" ${busy?'disabled':''}>${busy==='gen'?'Creating PDF…':'Create quote PDF'}</button><span class="small">Creates a PDF with the itemised estimate${t.photos&&t.photos.length?' and photos':''}, ready to download, save to Drive or send.</span></div>`;
  const ready = !!pdf;
  return `<div class="share">
    <div class="panel-h"><h2>Quote PDF</h2>${q.version?`<span class="qmeta">Latest ${esc(quoteNo(t))}</span>`:''}</div>
    ${err?`<div class="note crit">${esc(err)}</div>`:''}
    ${card}
    <h3 style="margin-top:4px">Send to customer</h3>
    ${ready?'':'<div class="note">Create the quote PDF first, then send it.</div>'}
    <div class="seg" role="group" aria-label="Channel">${[['whatsapp','WhatsApp'],['sms','SMS'],['email','Email']].map(([v,l])=>`<button data-action="share-ch" data-v="${v}" aria-pressed="${ch===v}">${l}</button>`).join('')}</div>
    <div class="form2">${ch==='email'
      ? `<label class="f">Customer email<input id="share-email" type="text" value="${esc(t.email||'')}" placeholder="name@example.com"></label>`
      : `<label class="f">Customer mobile<input id="share-phone" type="tel" value="${esc(t.phone||'')}" placeholder="10-digit mobile" class="mono"></label>`}</div>
    <label class="f">Message<textarea id="share-msg" rows="7">${esc(msg)}</textarea></label>
    <div class="toolbar">${
      ch==='whatsapp' ? `${ready?`<button class="btn" data-action="pdf-download" ${busy?'disabled':''}>1 · Download PDF</button>`:''}<a class="btn primary" href="${esc(waUrl)}" target="_blank" rel="noopener" data-action="log-share" data-ch="WhatsApp">${ready?'2 · ':''}Open WhatsApp</a><button class="btn ghost" data-action="copy-msg">Copy message</button>`
      : ch==='sms' ? `${ready && !q.driveLink?`<button class="btn" data-action="pdf-drive" ${busy?'disabled':''}>1 · Save to Drive for a link</button>`:''}<button class="btn primary" data-action="copy-msg">Copy message</button><a class="btn ghost" href="sms:${esc(num?'+'+num:'')}?body=${encodeURIComponent(msg)}" data-action="log-share" data-ch="SMS app">Open SMS app</a>`
      : `<button class="btn primary" data-action="share-email" ${busy||!ready?'disabled':''}>${busy==='email'?'Sharing…':'Email the PDF via Drive'}</button><button class="btn" data-action="copy-msg">Copy message</button><a class="btn ghost" href="mailto:${esc(t.email||'')}?subject=${encodeURIComponent('Service estimate '+quoteNo(t)+' — '+t.reg)}&body=${encodeURIComponent(msg)}" data-action="log-share" data-ch="Email app">Open email app</a>`
    }</div>
    <div class="note">${
      ch==='whatsapp' ? (num?'':'No valid mobile on file, so WhatsApp will ask you to pick the contact. ') + 'Download the PDF, then attach it in the WhatsApp chat that opens with the message ready. ' + (q.driveLink?'The Drive link is already in the message. ':'') + 'A WhatsApp Business API provider (Settings → Customer messaging) would send the PDF automatically.'
      : ch==='sms' ? 'SMS can\'t carry a file, so the message includes the Drive link. In Drive, set the file to "Anyone with the link" if the customer has no Google account.'
      : 'Saves the PDF to Drive (if needed), gives the customer view access and Google emails them the link.'}</div>
  </div>`;
}
async function shareToEmail(t){
  const email = (t.email||'').trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('Enter the customer\'s email address first'); return; }
  const pdf = await ensurePdf(t); if(!pdf) return;
  if(!t.quote.driveId || t.quote.driveNo !== pdf.no) await saveQuoteToDrive(t);
  if(!t.quote.driveId){ return; }
  S.busy = 'email'; render();
  try{
    const mcp = mcpRef || await claude.use('mcp'); mcpRef = mcp;
    await mcp.callTool(DRIVE, 'share_file', {fileId: t.quote.driveId, emailAddress: email, role: 'reader'});
    log(t, `Quote PDF ${pdf.no} shared with ${email} via Google Drive`); save(); toast(`Shared with ${email}. Google emails them the link.`);
  }catch(e){ toast(driveError(e)); }
  finally{ S.busy = ''; render(); }
}

function shareMessage(t){
  if(S.shareMsg[t.id] != null) return S.shareMsg[t.id];
  const q = quoteTotals(t, stageIndex(t.status)>=3);
  const link = t.quote && t.quote.driveLink ? `Quote PDF: ${t.quote.driveLink}` : 'The detailed quote PDF is attached.';
  const items = t.findings.map((f,i)=>`${i+1}. ${f.action} — ${inr((Number(f.partPrice)||0)+(Number(f.labourHrs)||0)*(Number(S.settings.pricing.labourRate)||0))}${f.priority==='Safety-critical'?' (safety-critical)':''}`).join('\n');
  return S.settings.messaging.template
    .replace(/\{customer\}/g, t.customer.split(' ')[0]).replace(/\{reg\}/g, t.reg).replace(/\{model\}/g, t.model)
    .replace(/\{dealer\}/g, S.settings.dealer.name).replace(/\{items\}/g, t.findings.length).replace(/\{total\}/g, inr(q.total))
    .replace(/\{link\}/g, link) + '\n\n' + items;
}
function waNumber(t){ const d = String(t.phone||'').replace(/\D/g,''); if(d.length===10) return (S.settings.messaging.cc||'91') + d; if(d.length>10) return d; return ''; }
async function copyMessage(t){
  const ta = $('#share-msg'); const text = ta ? ta.value : shareMessage(t);
  try{ await navigator.clipboard.writeText(text); toast('Message copied'); }
  catch(e){ if(ta){ ta.focus(); ta.select(); } toast('Press Ctrl+C (or long-press) to copy'); }
}
/* ---------- boot ---------- */
(function boot(){
  const stored = loadStore();
  if(stored && Array.isArray(stored.tickets)){
    S.tickets = stored.tickets; S.kb = (stored.kb && stored.kb.length) ? stored.kb : parseCSV(KB_CSV).records;
    S.settings = Object.assign(structuredClone(DEFAULT_SETTINGS), stored.settings||{});
    ['drive','dictation','upload','scanner','pricing','dealer','messaging','ai'].forEach(k => S.settings[k] = Object.assign({}, DEFAULT_SETTINGS[k], (stored.settings||{})[k]||{}));
    if((stored.settings||{}).seedVersion !== 2){ const g = seedTickets()[0]; if(!S.tickets.some(x=>x.id===g.id)) S.tickets.unshift(g); S.settings.seedVersion = 2; save(); }
  } else { S.kb = parseCSV(KB_CSV).records; S.tickets = seedTickets(); }
  if(stored && Array.isArray(stored.campaigns)) S.campaigns = stored.campaigns;
  ensureSurveys(); S.campaigns.filter(c=>c.status!=='done').forEach(c=>runCampaign(c.id));
  const h = location.hash.slice(1); if(['board','settings','new','analytics','surveys'].includes(h)) S.view = h;
  render();
  if(window.claude && claude.use){ maybeAutoSyncOnLoad(); claude.use('sample').then(s => s ? s.limits() : null).then(l => { if(l && l.images){ S.aiImages = true; render(); } }).catch(()=>{}); }
})();
</script>
